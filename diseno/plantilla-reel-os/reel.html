<!doctype html><html><head><meta charset="utf-8">
<link id="gf" href="" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;font-family:var(--f-texto);overflow:hidden;background:var(--c-claro)}
.tag{position:absolute;left:96px;top:150px;font-weight:700;font-size:26px;letter-spacing:.22em;text-transform:uppercase}
.bar{position:absolute;left:96px;right:96px;top:230px;display:flex;gap:14px}
.bar i{flex:1;height:10px;border-radius:5px;background:var(--c-barra)}.bar i.on{background:var(--c-acento)}
.scene{position:absolute;inset:0;padding:330px 96px 300px;display:flex;flex-direction:column;justify-content:center;gap:44px;opacity:0}
.it{opacity:0;will-change:transform,opacity}
.big{font-family:var(--f-titulares);font-weight:700;letter-spacing:-.045em;line-height:1}
.sub{font-size:44px;font-weight:600;line-height:1.38}
.num{font-family:var(--f-titulares);font-weight:700;color:var(--c-acento);font-size:300px;line-height:.8;letter-spacing:-.05em}
.chips span{display:inline-block;font-size:34px;font-weight:700;border-radius:999px;padding:14px 28px;margin:0 12px 14px 0}
.chat{background:#fff;border:2px solid #DED8CC;border-radius:36px;padding:40px;box-shadow:0 30px 80px rgba(21,2,55,.12);max-width:820px}
.chat .hd{display:flex;justify-content:space-between;font-size:28px;font-weight:700;color:#696373;margin-bottom:24px}
.chat .b{background:color-mix(in srgb,var(--c-acento) 14%,#fff);color:var(--c-tinta);font-size:38px;font-weight:600;border-radius:28px 28px 28px 8px;padding:26px 32px;line-height:1.35}
.sig{position:absolute;left:96px;right:96px;bottom:140px;display:flex;justify-content:space-between;font-size:30px;font-weight:700;opacity:0;color:var(--c-claro)}
.sig span:last-child{color:var(--c-acento);letter-spacing:.18em;font-size:22px;align-self:center}
</style></head><body><div id="stage"><div class="tag" id="tag"></div><div class="bar" id="bar"></div>
<div class="sig" id="sig"><span id="firma"></span><span id="firmaDer"></span></div></div>
<script>
const SPEC = /*__SPEC__*/null;
const B = SPEC.brand, C = B.colores, R = document.documentElement.style;
document.getElementById('gf').href = B.googleFonts || '';
R.setProperty('--f-titulares', B.fuenteTitulares); R.setProperty('--f-texto', B.fuenteTexto);
R.setProperty('--c-claro', C.claro); R.setProperty('--c-acento', C.acento); R.setProperty('--c-barra', C.barraApagada); R.setProperty('--c-tinta', C.tinta);
document.getElementById('tag').textContent = B.etiqueta || ''; document.getElementById('firma').textContent = B.firma || ''; document.getElementById('firmaDer').textContent = B.firmaDerecha || '';
const PAL={cream:{bg:C.claro,fg:C.tinta,soft:C.oscuro,tag:C.tinta},deep:{bg:C.medio,fg:C.claro,soft:C.textoSuaveOscuro,tag:C.claro},black:{bg:C.oscuro,fg:C.claro,soft:C.textoSuaveOscuro,tag:C.claro}};
const ease=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
const stage=document.getElementById('stage'), bar=document.getElementById('bar');
const nSteps=SPEC.scenes.filter(s=>s.step).length; for(let i=0;i<nSteps;i++){bar.appendChild(document.createElement('i'));}
let t0=0; const scenes=[];
SPEC.scenes.forEach(s=>{
  const el=document.createElement('div'); el.className='scene'; const p=PAL[s.bg]; s.start=t0; s.end=t0+s.dur; t0=s.end;
  s.items.forEach(it=>{
    let d=document.createElement('div'); d.className='it';
    if(it.kind==='big'){d.classList.add('big');d.style.fontSize=(it.size||120)+'px';d.style.color=it.accent?C.acento:p.fg;d.innerHTML=it.text;}
    else if(it.kind==='sub'){d.classList.add('sub');d.style.color=it.accent?C.acento:p.soft;if(it.accent)d.style.fontWeight=700;d.innerHTML=it.text;}
    else if(it.kind==='num'){d.classList.add('num');d.textContent=it.text;}
    else if(it.kind==='chips'){d.classList.add('chips');d.innerHTML=it.items.map(c=>`<span style="background:${it.accent?C.acento:C.chip};color:${C.claro}">${c}</span>`).join('');}
    else if(it.kind==='chat'){d.classList.add('chat');d.innerHTML=`<div class="hd"><span>${it.who}</span><span>${it.time||''}</span></div><div class="b">${it.text}</div>`;}
    it.el=d; el.appendChild(d);
  });
  stage.appendChild(el); s.el=el; scenes.push(s);
});
SPEC.total=t0;
window.render=function(t){
  let cur=scenes[0]; for(const s of scenes) if(t>=s.start) cur=s;
  const p=PAL[cur.bg]; stage.style.background=p.bg; document.getElementById('tag').style.color=p.tag;
  let stepIdx=0; scenes.forEach(s=>{ if(s.step && t>=s.start) stepIdx++; });
  bar.style.opacity = cur.step?1:0; [...bar.children].forEach((b,i)=>b.className=i<stepIdx?'on':'');
  scenes.forEach(s=>{
    const vis = t>=s.start && t<s.end; const out = s.last?1:1-ease((t-(s.end-0.3))/0.3);
    s.el.style.opacity = vis?out:0;
    s.items.forEach(it=>{ const a=s.start+(it.t||0)+0.1; const i=ease((t-a)/0.45); it.el.style.opacity=i; it.el.style.transform=`translateY(${(1-i)*(it.kind==='chat'?110:55)}px)`; });
  });
  const last=scenes[scenes.length-1]; document.getElementById('sig').style.opacity = ease((t-(last.start+(last.sigAt||2.5)))/0.5);
};
window.render(0);
</script></body></html>
